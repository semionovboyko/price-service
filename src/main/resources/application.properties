spring.application.name=price-service

spring.datasource.url=jdbc:h2:mem:pricedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Sin esto, Spring ejecuta data.sql ANTES de que Hibernate cree el esquema
# a partir de las entidades, y el INSERT falla contra una tabla inexistente.
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080